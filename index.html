<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Wash Systems</title>
</head>
<body>

<header>

    <h1>Cash Wash Systems</h1>

     <nav>
      <a href="#">Dashboard</a>
      <a href="#customers">Customers</a>
      <a href="#vehicles">Vehicles</a>
      <a href="#services">Services</a>
      <a href="#">Bookings</a>
      <a href="#">Payments</a>

     </nav>

</header>

<main>

<section >

    <h2>Dashboard</h2>
    <p>Welcome to Car Wash Systems.</p> 

   <div  class="dashbord-card">

       <h3>Customers</h3>
       <p>25</p>

   </div>
       

   <div class="dashbord-card">
       <h3>Vehicles</h3>
       <p>31</p>
   </div>

   <div  class="dashbord-card">

       <h3>Today's washes</h3>
       <p>18</p>

   </div>


   <div  class="dashbord-card">

       <h3>Today's Revenue</h3>
       <p>R2450.00</p>

   </div>

</section>


<!--customer form-->

<section id="customers">

      <h2>Customers</h2>

      <form id="customer-form">

        <label for="customer-name">Full Name</label>
        <input type="text" id="customer-name" name="customer-name">

        <label for="customer-phone">Phone Number</label>
        <input type="tel" id="customer-phone" name="customer-phone">

        <label for="customer-email">Email Address</label>
        <input type="email" id="customer-email" name="customer-eamil">


        <button type="submit">Add Customer</button>

      </form>
     

      <p id="customer-message"></p>

</section>



<!--vehicle form-->

<section id="vehicles">
     
      <h2>Vehicles</h2>


      <form id="vehicle-form">

          <label for="vehicle-customer">Customer</label>
          <select name="vehicle-customer" id="vehicle-customer" required>
              
            <option value="">Select Customer</option>
            <option value="customer-1">Seo</option>

          </select>

          <label for="registration-number">Registration Number</label>

          <input type="text"
                 id="registration-number"
                 name="registration-number"
                 required
          >

          <label for="vehicle-make">Vehicle Make</label>

          <input type="text"
                 id="vehicle-make"
                 name="vehicle-make"
                 required
          >



        <label for="vehicle-model">Vehicle Model</label>

          <input type="text"
                 id="vehicle-model"
                 name="vehicle-model"
                 required
          >

          <button type="submit">Add Vehicle</button>

      </form>

      <p id="vehicle-message"></p>

</section>


<!--services form-->


<section id="services">

    <h2>Services</h2>


<form id="service-form">

      
<label for="service-name">Sevices Name</label>
<input 
    type="text"
    id="service-name"
    name="service-name"
    required
    >

<label for="service-description">Description</label>
<textarea 
    name="service-description" 
    id="service-description">
    rows="4"
</textarea>

<label for="service-price">Price</label>
<input 
    type="number"
    id="service-price"
    min="0"
    step="0.01"
    required
    >

    <button type="sumbit">Added Service</button>


</form>

<p id="service-message"></p>


</section>


<form id="bookings">
     
    <h2>Bookings</h2>

    <label for="booking-customer">Customer</label>
    <select name="booking-customer" id="booking-customer" required>
          <option value="">Select Customer</option>
          <option value="customer-1">seo</option>

    </select>

    <label for="booking-vehicle">Vehicle</label>
    <select name="booking-vehicle" id="booking-vehicle" required>
          <option value="">Select vehicle</option>
          <option value="vehicle-1">Toyota corolla</option>

    </select>

    <label for="booking-service">Service</label>
    <select name="booking-service" id="booking-service" required>
          <option value="">Select Service</option>
          <option value="service-1">Full Wash -R100</option>

    </select>


    <label for="booking-date">Date</label>
    <input 
        type="date"
        id="booking-date"
        name="booking-date"
        required

    >

</form>

</main>
    



<script src="JS/app.js"></script>

</body>
</html>
